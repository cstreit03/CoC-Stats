name = "clash-of-clans-stats"
main = "worker/index.js"
compatibility_date = "2026-09-01"
# Keep variables added in the Cloudflare dashboard when deploying from Git.
keep_vars = true

# Static dashboard (HTML/CSS/JS). /api/* is handled by the Worker first.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Hourly data collection.
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "coc-stats"
# No database_id: `wrangler deploy` creates the database on first deploy.

[vars]
# Clan tag including the '#'.
CLAN_TAG = "#CPJQ2JV"
# RoyaleAPI proxy lets the CoC API key work from Cloudflare's changing IPs.
# Whitelist 45.79.218.79 on your key at developer.clashofclans.com.
COC_API_BASE = "https://cocproxy.royaleapi.dev/v1"

# Secret (set with `npx wrangler secret put COC_API_TOKEN`):
#   COC_API_TOKEN  - Clash of Clans API token

[observability.logs]
enabled = false
invocation_logs = true
