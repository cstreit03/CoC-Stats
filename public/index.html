<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
    <meta name="description" content="Clan war, CWL, raid and roster statistics.">
    <title>Clan Stats</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        // Apply the saved theme before first paint to avoid a flash.
        try { const t = JSON.parse(localStorage.getItem('cocstats:theme')); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="app-header">
        <div class="header-inner">
            <a class="brand" href="#/" aria-label="Clan overview">
                <img id="clanBadge" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="">
                <span>
                    <span class="brand-name" id="clanName">Clan Stats</span>
                    <span class="brand-sub" id="clanSub"></span>
                </span>
            </a>
            <nav class="topnav" aria-label="Main"></nav>
            <div class="header-actions">
                <button type="button" class="status-pill" id="reloadBtn" aria-describedby="freshness">
                    <span class="dot" id="freshDot" aria-hidden="true"></span>
                    <span id="freshness" aria-live="polite">Loading…</span>
                    <span id="reloadIcon" aria-hidden="true"></span>
                </button>
                <button type="button" class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"></button>
            </div>
        </div>
    </header>

    <main id="main" tabindex="-1"></main>

    <nav class="bottomnav" aria-label="Main"></nav>

    <script type="module" src="js/main.js"></script>
</body>
</html>
